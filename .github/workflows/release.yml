name: Выпуск

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache: false
      - name: Проверить версию
        run: grep -qx "VERSION=\"${GITHUB_REF_NAME#v}\"" awg-cascade.sh.in
      - name: Собрать
        run: bash build.sh
      - name: Посчитать контрольные суммы
        run: sha256sum awg-cascade.sh awg-cascade-panel > SHA256SUMS
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" awg-cascade.sh awg-cascade-panel SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes 'Установка: curl -fsSL https://raw.githubusercontent.com/morphing888/FineVPS/main/install.sh | sudo bash'
