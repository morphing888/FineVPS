name: Выпуск

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache: false
      - name: Определить версию
        run: echo "TAG=v$(sed -n 's/^VERSION="\(.*\)"$/\1/p' awg-cascade.sh.in)" >>"$GITHUB_ENV"
      - name: Собрать
        run: bash build.sh
      - name: Посчитать контрольные суммы
        run: sha256sum awg-cascade.sh awg-cascade-panel > SHA256SUMS
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" awg-cascade.sh awg-cascade-panel SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file RELEASE_NOTES.md
